# HTTP: serve ACME challenges, redirect everything else
server {
    listen 80;
    server_name gatitolindo.mooo.com;

    # 1) ACME challenge responses
    location ^~ /.well-known/acme-challenge/ {
        root /certbot/www;
        try_files $uri =404;
    }

    # 2) Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: your app + API proxy
server {
    listen 443 ssl http2;
    server_name gatitolindo.mooo.com;

    root   /usr/share/nginx/html;
    index  index.html;

    ssl_certificate     /certbot/config/live/gatitolindo.mooo.com/fullchain.pem;
    ssl_certificate_key /certbot/config/live/gatitolindo.mooo.com/privkey.pem;
    ssl_trusted_certificate /certbot/config/live/gatitolindo.mooo.com/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Serve React app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to FastAPI
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
